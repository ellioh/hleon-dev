# Reverse proxy + servidor de archivos estáticos para la API de Laravel.
# admin.hleon.dev (Fase 3) se agrega como un segundo `server{}` en este
# mismo archivo cuando exista apps/admin - no antes.
server {
    listen 80;
    server_name api.hleon.dev localhost;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass laravel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
}
