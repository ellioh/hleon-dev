; Pool PHP-FPM propio de hleon.dev (ver deploy/README.md).
; Aísla los procesos de la API de los de la otra web del VPS, que usa el pool
; [www] de php8.3-fpm. Copiar a /etc/php/8.3/fpm/pool.d/hleon.conf
[hleon]
user = www-data
group = www-data

listen = /run/php/php8.3-fpm-hleon.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Sitio de poco tráfico: pocos procesos, creados bajo demanda
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
pm.max_requests = 500

php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
php_admin_value[memory_limit] = 256M
