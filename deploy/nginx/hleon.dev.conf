# hleon.dev en VPS sin Docker (ver deploy/README.md y ADR 0012).
# Copiar a /etc/nginx/sites-available/hleon.dev y enlazar en sites-enabled.
# Certbot (`certbot --nginx -d hleon.dev -d www.hleon.dev -d api.hleon.dev`)
# agrega los bloques 443/SSL sobre esta base.

# ── Sitio público (Next.js) + panel admin en /panel ─────────────────────────
server {
    listen 80;
    server_name hleon.dev;

    client_max_body_size 20M;

    # Panel React (build estático de apps/admin, compilado con base /panel/)
    location = /panel {
        return 301 /panel/;
    }

    location /panel/assets/ {
        alias /var/www/hleon.dev/apps/admin/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /panel/ {
        alias /var/www/hleon.dev/apps/admin/dist/;
        try_files $uri $uri/ /panel/index.html;
        add_header Cache-Control "no-cache";
    }

    # Todo lo demás lo sirve Next.js (pm2: hleon-web, puerto 3001)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}

server {
    listen 80;
    server_name www.hleon.dev;
    return 301 https://hleon.dev$request_uri;
}

# ── API Laravel ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.hleon.dev;

    root /var/www/hleon.dev/backend/laravel/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Socket de PHP-FPM 8.3. Si se crea un pool propio (recomendado, ver
        # deploy/README.md), cambiar por /run/php/php8.3-fpm-hleon.sock
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
}
